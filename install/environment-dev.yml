name: paqr3
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - pandas>=1.5.0
  - numpy>=1.20.0
  - scipy>=1.7.0
  - gtfparse
  - intervaltree
  - HTSeq
  - pybedtools
  - deeptools
  - ucsc-gtftogenepred
  - ucsc-bedgraphtobigwig
  - pigz
  - pip >=20.2.3
  - pylint >=2.4.4
  - pytest >=6.1.0
  - mypy >=0.782
  - flake8 >=3.8.4
  - coverage >=5.3
  - pip:
    - -e .