name: Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      # micromamba solves faster than conda, and the cached env is reused
      # until install/environment-dev.yml changes.
      - name: Set up environment (micromamba)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: install/environment-dev.yml
          environment-name: paqr3
          cache-environment: true
          cache-downloads: true

      # The cached env may hold an older editable install; reinstall the
      # checked-out package without touching dependencies.
      - name: Install paqr3
        run: pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check paqr3/ tests/

      - name: Type check (mypy)
        run: mypy paqr3/
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage report --fail-under=100

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
